name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false
      - run: uv pip install .
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.10"
          enable-cache: false
      - run: uv build
      - name: pip install wheel
        run: |
          uv venv --seed /tmp/wheel
          /tmp/wheel/bin/pip install dist/*.whl
          /tmp/wheel/bin/aclpubcheck --help
          /tmp/wheel/bin/python -m aclpubcheck --help
      - name: pip install sdist
        run: |
          uv venv --seed /tmp/sdist
          /tmp/sdist/bin/pip install dist/*.tar.gz
          /tmp/sdist/bin/aclpubcheck --help
      - name: pip install -e
        run: |
          uv venv --seed /tmp/editable
          /tmp/editable/bin/pip install -e .
          /tmp/editable/bin/aclpubcheck --help
      - run: uvx --from . aclpubcheck --help

  # Ubuntu 22.04's pip uses the system setuptools in isolated builds (LP: #2018288)
  ubuntu-22-04-pip:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git python3-pip
      - uses: actions/checkout@v7
      - run: pip3 install .
      - run: aclpubcheck --help
